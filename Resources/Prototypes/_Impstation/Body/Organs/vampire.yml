- type: entity
  id: OrganVampireStomach
  parent: BaseHumanOrgan
  name: stomach
  description: What is this? A stomach for a vampire?
  components:
  - type: Sprite
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [ Vampire ]
    groups:
    - id: Food
    - id: Drink
  - type: Tag # goob edit
    tags:
      - Meat
      - Organ
      - Stomach
