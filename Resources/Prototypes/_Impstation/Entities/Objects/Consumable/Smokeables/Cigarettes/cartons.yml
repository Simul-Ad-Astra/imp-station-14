- type: entity
  parent: BaseAmmoProvider
  id: StackOfCigs
  name: 500 cigarettes
  description: The aroma is most pleasing.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Cartons/500cigarettes.rsi
    state: 500-cigarettes
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Cigarette
    proto: Cigarette
    capacity: 500

- type: entity
  id: CigCartonMixedRejects
  parent: [CigCartonGreen, Tier2Contraband]
  name: Dan's soaked smokes rejects carton
  description: A carton containing 6 packets of Dan's Soaked Smokes Rejects, plus an exclusive Syndicate-branded flippo.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/mixedrejectscarton.rsi
  - type: Item
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/mixedrejectscarton.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CigPackMixedRejects
          amount: 6
        - id: SyndicateFlippo
          amount: 1
  - type: Storage
    grid:
    - 0,0,5,1
    - 6,1,6,1

- type: entity
  id: CigCartonCandy
  parent: [ BoxCardboard, BaseBagOpenClose ]
  name: Cool Cowboy's Candy Cigarettes Carton
  description: Comes with 5 packets of everyone's* favorite candy cigarettes. This product is not sutable for children.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/green.rsi # imp
    layers: # imp
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
  - type: Item
    sprite: _Impstation/Objects/Consumable/Smokeables/Cartons/green.rsi # imp
    size: Normal
  - type: Storage
    grid:
    - 0,0,4,1
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigPackGreen
        amount: 5
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage
