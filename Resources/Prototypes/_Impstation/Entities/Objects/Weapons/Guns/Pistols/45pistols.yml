# .45 Magnum (CartridgeMagnum) should deal 35 pierce per shot on average (+25).
# Base Pistol Weapons have a default GunDamage bonus of +6 Piercing.

- type: entity
  name: Sturm-96
  parent: [BaseWeaponInternalPistol, BaseSecurityContraband]
  id: WeaponPistolSturm
  description: An expertly crafted magnum awarded to prestigious officers. Uses .45 Magnum.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/sturm.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/sturm.rsi
  - type: Gun
    fireRate: 1.3
    soundGunshot:
      path: /Audio/_Impstation/Weapons/Guns/Gunshots/pistolsturm.ogg
  - type: GunDamage
    damage:
      types:
        Piercing: 28 #38 damage total
    damageSpecific:
      DamageVariable:
        types:
          Piercing: 0
  - type: MeleeWeapon
    range: 0.8
    attackRate: 0.5
    damage:
      types:
        Blunt: 7
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
    soundSwing:
      path: /Audio/_Impstation/Weapons/Guns/Melee/shove_foley.ogg
    resetOnHandSelected: false
    wideAnimationRotation: -80
  - type: AltFireMelee
    attackType: Heavy
  - type: DamageOtherOnHit #for throwing
    staminaCost: 9
    damage:
      types:
        Blunt: 8

- type: entity
  name: N1984
  parent: [BaseWeaponPistol, BaseSecurityContraband]
  id: WeaponPistolN1984
  description: The sidearm of any self-respecting officer, often favored by ERT security forces. Feeds from pistol magazines (.45 magnum).
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/N1984.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/N1984.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 20
    angleIncrease: 8
    angleDecay: 9
    fireRate: 4
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/hpistol.ogg #it's a damn .45 you GOTTA make it sound heavier
  - type: GunDamage
    damage:
      types:
        Piercing: 25 #35 damage total
    damageSpecific:
      DamageVariable:
        types:
          Piercing: 0
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnum
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineMagnum
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnum
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum

- type: entity
  name: Epoch Mk.3
  parent: [BaseWeaponPistol, BaseMajorContraband]
  id: WeaponPistolEpoch
  description: Part of a limited-production prototype from a master gunsmith. The lack of magazine and self-reloading mechanism makes it handle and aim like a dream. Uses .45 magnum ammo.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/epoch.rsi
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/epoch.rsi
  - type: Clothing
    slots:
    - suitStorage
    - Belt
    sprite: _Impstation/Objects/Weapons/Guns/Pistols/epoch.rsi
  - type: Gun
    fireRate: 5
    minAngle: 0
    maxAngle: 2
    angleIncrease: 1
    angleDecay: 10
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/hpistol.ogg
  - type: Wieldable
  # - type: UseDelay
  #   delay: 1.0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: ItemSlots
    slots:
      # gun_magazine:
      #   name: Magazine
      #   startingItem: MagazinePistol
      #   insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
      #   ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
      #   priority: 2
      #   whitelist:
      #     tags:
      #       - MagazinePistol
      #   whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnum
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: ContainerContainer
    containers:
      # gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MeleeWeapon
    range: 1
    attackRate: 1
    damage:
      types:
        Blunt: 8
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
    soundSwing:
      path: /Audio/_Impstation/Weapons/Guns/Melee/shove_foley.ogg
    resetOnHandSelected: false
    wideAnimationRotation: -80
  - type: AltFireMelee
    attackType: Heavy
  - type: DamageOtherOnHit #for throwing
    staminaCost: 2
    damage:
      types:
        Blunt: 8
